[project]
name = "repomine"
version = "0.1.0"
description = "CLI y API para minería y análisis de repositorios git"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "lizard>=1.22.1",
    "pydriller>=2.9",
    "rich>=15.0.0",
    "typer>=0.25.1",
    "uvicorn>=0.47.0",
]

[project.scripts]
repomine = "cli:app"

[tool.setuptools.packages.find]
include = ["core*", "backend*"]

[tool.setuptools]
py-modules = ["cli"]
